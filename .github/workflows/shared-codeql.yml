name: CodeQL Advanced

on:
  workflow_call:
    inputs: 
      language:
        description: 'Language to run CodeQL on. e.g. `c-cpp`'
        required: true
        type: string
      build-mode:
        description: 'Build mode for the language, e.g. `autobuild` for `c-cpp` or `none` for `actions`'
        default: 'none'
        required: false
        type: string
      manual-command-list:
        description: 'If build-mode is set to `manual` then this will be used to build the code'
        required: false
        type: string
        
jobs:
  analyze:
    name: Analyze (${{ inputs.language }})
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      packages: read

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      
      # Initializes the CodeQL tools for scanning.
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ inputs.language }}
          build-mode: ${{ inputs.build-mode }}

      - name: Run manual build steps
        if: inputs.build-mode == 'manual'
        shell: bash
        run: ${{ inputs.manual-command-list }}
        
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{inputs.language}}"
